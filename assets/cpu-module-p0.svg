<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950"><rect width="1400" height="950" fill="#f7fafc"/><rect width="1400" height="105" fill="#17364e"/><text x="40" y="56" fill="white" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="bold">CPU P0 — U1 / U2 / JH1: правильная схема соединений</text><text x="40" y="86" fill="#e4eaf1" font-family="DejaVu Sans,sans-serif" font-size="17">Три отдельных канала буфера. Вход / выход U2 НЕ замкнуты проводом.</text><text x="40" y="144" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#17364e" font-weight="bold">U1 = плата DevKitC-1</text><text x="486" y="144" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#17364e" font-weight="bold">U2 = 74HC125D (SOIC14→DIP14)</text><text x="1022" y="144" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#17364e" font-weight="bold">JH1 = отдельный разъём HESS-40</text><rect x="40" y="190" width="330" height="104" rx="9" fill="#eaf2fa" stroke="#cdd8e2" stroke-width="1.5"/><text x="55" y="223" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#8260b5" font-weight="bold">CLK</text><text x="55" y="259" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#233749" font-weight="normal">U1.J1.4 / GPIO4</text><path d="M370 240 L445 240" stroke="#8260b5" stroke-width="3" fill="none"/><rect x="445" y="186" width="430" height="112" rx="9" fill="#e9f7f0" stroke="#93bca8" stroke-width="1.5"/><text x="457" y="225" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#8260b5" font-weight="bold">U2.2 / 1A</text><text x="634" y="259" font-family="DejaVu Sans,sans-serif" font-size="50" fill="#276752" font-weight="bold">▹</text><text x="735" y="225" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#8260b5" font-weight="bold">U2.3 / 1Y</text><text x="465" y="283" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#4b6074" font-weight="normal">внутренний канал, НЕ провод</text><path d="M875 240 L995 240" stroke="#8260b5" stroke-width="3" fill="none"/><rect x="995" y="190" width="345" height="104" rx="9" fill="#fff0d8" stroke="#cdd8e2" stroke-width="1.5"/><text x="1020" y="243" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#8260b5" font-weight="bold">JH1.9</text><text x="1005" y="274" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#4b6074" font-weight="normal">/OE = U2.1; HIGH → Hi-Z</text><rect x="40" y="360" width="330" height="104" rx="9" fill="#eaf2fa" stroke="#cdd8e2" stroke-width="1.5"/><text x="55" y="393" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#ba7b25" font-weight="bold">D0 / MOSI</text><text x="55" y="429" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#233749" font-weight="normal">U1.J1.5 / GPIO5</text><path d="M370 410 L445 410" stroke="#ba7b25" stroke-width="3" fill="none"/><rect x="445" y="356" width="430" height="112" rx="9" fill="#e9f7f0" stroke="#93bca8" stroke-width="1.5"/><text x="457" y="395" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#ba7b25" font-weight="bold">U2.5 / 2A</text><text x="634" y="429" font-family="DejaVu Sans,sans-serif" font-size="50" fill="#276752" font-weight="bold">▹</text><text x="735" y="395" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#ba7b25" font-weight="bold">U2.6 / 2Y</text><text x="465" y="453" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#4b6074" font-weight="normal">внутренний канал, НЕ провод</text><path d="M875 410 L995 410" stroke="#ba7b25" stroke-width="3" fill="none"/><rect x="995" y="360" width="345" height="104" rx="9" fill="#fff0d8" stroke="#cdd8e2" stroke-width="1.5"/><text x="1020" y="413" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#ba7b25" font-weight="bold">JH1.11</text><text x="1005" y="444" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#4b6074" font-weight="normal">/OE = U2.4; HIGH → Hi-Z</text><rect x="40" y="530" width="330" height="104" rx="9" fill="#eaf2fa" stroke="#cdd8e2" stroke-width="1.5"/><text x="55" y="563" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#2783af" font-weight="bold">XFER_OUT_N</text><text x="55" y="599" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#233749" font-weight="normal">U1.J1.15 / GPIO9</text><path d="M370 580 L445 580" stroke="#2783af" stroke-width="3" fill="none"/><rect x="445" y="526" width="430" height="112" rx="9" fill="#e9f7f0" stroke="#93bca8" stroke-width="1.5"/><text x="457" y="565" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#2783af" font-weight="bold">U2.9 / 3A</text><text x="634" y="599" font-family="DejaVu Sans,sans-serif" font-size="50" fill="#276752" font-weight="bold">▹</text><text x="735" y="565" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#2783af" font-weight="bold">U2.8 / 3Y</text><text x="465" y="623" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#4b6074" font-weight="normal">внутренний канал, НЕ провод</text><path d="M875 580 L995 580" stroke="#2783af" stroke-width="3" fill="none"/><rect x="995" y="530" width="345" height="104" rx="9" fill="#fff0d8" stroke="#cdd8e2" stroke-width="1.5"/><text x="1020" y="583" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#2783af" font-weight="bold">JH1.19</text><text x="1005" y="614" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#4b6074" font-weight="normal">/OE = U2.10; HIGH → Hi-Z</text><rect x="40" y="738" width="1300" height="173" rx="9" fill="#ffffff" stroke="#cbd7e2" stroke-width="1.5"/><text x="55" y="779" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#17364e" font-weight="bold">Питание и блокировка выходов (без проводов, скрытых под текстом)</text><text x="55" y="818" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#233749" font-weight="normal">U2.14 = +3,3 В     U2.7 = GND       C1 = 100 нФ между U2.14 и U2.7</text><text x="55" y="849" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#233749" font-weight="normal">U2.1 + U2.4 + U2.10 = сеть /CPU_OE; R1 = 10 кОм к +3,3 В → Hi-Z на P0</text><text x="55" y="880" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#233749" font-weight="normal">U2.13 → +3,3 В; U2.12 → GND; U2.11 — NC.   USB ПК → штатный USB/U1.</text></svg>