<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880"><rect width="1400" height="880" fill="#f8fafc"/><g font-family="sans-serif"><text x="40" y="52" font-size="30" font-weight="bold" fill="#1a3551">Synthesys CPU P0 · HESS + USB functional wiring schematic</text><text x="40" y="82" font-size="16" fill="#526579">Functional nets only; not a solder-ready package-pin schematic. All HESS bus drivers disabled on P0.</text><rect x="30" y="155" width="240" height="135" rx="10" fill="#d7eaff" stroke="#516174" stroke-width="2"/><text x="150" y="189" text-anchor="middle" font-size="23" font-weight="bold" fill="#213448">PC / terminal</text><text x="54" y="223" font-size="16" fill="#243b53">USB CDC serial + JTAG</text><text x="54" y="249" font-size="16" fill="#243b53">Debug, input, logs</text><rect x="350" y="126" width="333" height="510" rx="10" fill="#e2e8f0" stroke="#516174" stroke-width="2"/><text x="516.5" y="160" text-anchor="middle" font-size="23" font-weight="bold" fill="#213448">U1 · ESP32-S3 N16R8</text><text x="374" y="194" font-size="16" fill="#243b53">DevKit + own 3V3 regulator</text><text x="374" y="220" font-size="16" fill="#243b53">GPIO19/20: USB D-/D+</text><text x="374" y="246" font-size="16" fill="#243b53">GPIO4: CLK (buffered)</text><text x="374" y="272" font-size="16" fill="#243b53">GPIO5: D0 MOSI (buffered)</text><text x="374" y="298" font-size="16" fill="#243b53">GPIO6: D1 MISO (input)</text><text x="374" y="324" font-size="16" fill="#243b53">GPIO9: XFER (buffered)</text><text x="374" y="350" font-size="16" fill="#243b53">GPIO10: CTRL_SER</text><text x="374" y="376" font-size="16" fill="#243b53">GPIO11: CTRL_SCK</text><text x="374" y="402" font-size="16" fill="#243b53">GPIO12: CTRL_LATCH</text><text x="374" y="428" font-size="16" fill="#243b53">GPIO13: BUS_ENABLE=LOW</text><text x="374" y="454" font-size="16" fill="#243b53">GPIO14: ATTN_N input</text><text x="374" y="480" font-size="16" fill="#243b53">GPIO15: SYS_RST_N via O/D</text><text x="374" y="506" font-size="16" fill="#243b53">UART0 GPIO43/44 optional</text><rect x="756" y="205" width="245" height="215" rx="10" fill="#d8f2e9" stroke="#516174" stroke-width="2"/><text x="878.5" y="239" text-anchor="middle" font-size="23" font-weight="bold" fill="#213448">U2 · buffer 3V3</text><text x="780" y="273" font-size="16" fill="#243b53">74LVC125 3 channels</text><text x="780" y="299" font-size="16" fill="#243b53">CLK / D0 / XFER</text><text x="780" y="325" font-size="16" fill="#243b53">OE hardware gated:</text><text x="780" y="351" font-size="16" fill="#243b53">BUS_ENABLE &amp; owner=CPU</text><text x="780" y="377" font-size="16" fill="#243b53">Default reset = Hi-Z</text><rect x="1060" y="126" width="300" height="510" rx="10" fill="#fff0d4" stroke="#516174" stroke-width="2"/><text x="1210" y="160" text-anchor="middle" font-size="23" font-weight="bold" fill="#213448">J1 · HESS-40</text><text x="1084" y="194" font-size="16" fill="#243b53">Keyed 2x20 header</text><text x="1084" y="220" font-size="16" fill="#243b53">9 CLK / 11 D0 / 13 D1</text><text x="1084" y="246" font-size="16" fill="#243b53">19 XFER (gated)</text><text x="1084" y="272" font-size="16" fill="#243b53">21 CS_N / 23 GRANT_N</text><text x="1084" y="298" font-size="16" fill="#243b53">25 ATTN_N / 27 RST_N</text><text x="1084" y="324" font-size="16" fill="#243b53">37 CTRL_SER</text><text x="1084" y="350" font-size="16" fill="#243b53">38 CTRL_SCK</text><text x="1084" y="376" font-size="16" fill="#243b53">39 CTRL_LATCH</text><text x="1084" y="402" font-size="16" fill="#243b53">40 BUS_ENABLE</text><text x="1084" y="428" font-size="16" fill="#243b53">1,2,5,6 = +5V</text><text x="1084" y="454" font-size="16" fill="#243b53">Ground: 3,4,7,8 and pairs</text><g fill="none" stroke-width="3"><path d="M270 214 H350" stroke="#377cb3"/><path d="M683 290 H756 M683 318 H756 M683 346 H756" stroke="#378473"/><path d="M1001 290 H1060 M1001 318 H1060 M1001 346 H1060" stroke="#378473"/><path d="M683 390 H1029 V290 H1060" stroke="#3f6690" stroke-dasharray="7 4"/><path d="M683 449 H1041 V409 H1060 M683 475 H1031 V435 H1060 M683 501 H1021 V461 H1060 M683 527 H1011 V487 H1060" stroke="#9c7137"/></g><rect x="758" y="475" width="245" height="151" rx="10" fill="#ffe1e3" stroke="#516174" stroke-width="2"/><text x="880.5" y="509" text-anchor="middle" font-size="23" font-weight="bold" fill="#213448">JP_PWR + VBUS</text><text x="782" y="543" font-size="16" fill="#243b53">HESS +5V → VIN jumper</text><text x="782" y="569" font-size="16" fill="#243b53">OPEN when USB powered</text><text x="782" y="595" font-size="16" fill="#243b53">No USB/HESS backfeed</text><text x="782" y="621" font-size="16" fill="#243b53">Verify actual DevKit!</text><path d="M1003 550 H1060" fill="none" stroke="#b34a4f" stroke-width="3"/><rect x="40" y="684" width="1320" height="147" rx="9" fill="#e5ecf5"/><text x="68" y="716" font-size="21" font-weight="bold" fill="#1c3854">SAFETY · Before powering up</text><text x="68" y="752" font-size="17" fill="#3c526c">HESS +5V and USB VBUS must be isolated/tested · no direct CLK/MOSI/XFER without external gate.</text><text x="68" y="787" font-size="17" fill="#3c526c">GPIO13 pulled down 10k on backplane · no master OE until verified arbiter circuit · USB is local to DevKit.</text><text x="68" y="814" font-size="16" fill="#3c526c">USB serial transfers virtual key commands; not a physical USB HID keyboard.</text></g></svg>